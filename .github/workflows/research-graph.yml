name: 更新调研图谱

on:
  push:
    branches: [openjiuwen-harness]
    paths:
      - 'themes.yaml'
      - '.agents/skills/research-common/scripts/research_catalog.py'
      - 'research-reports/**'
      - 'analysis-reports/**'
      - '*/plan.md'
      - '*/paper/**'
      - '*/open-source/**'
      - '*/product/**'
      - '*/benchmark/**'
      - '*/analysis/**'
      - 'plans/**'
      - 'paper/**'
      - 'open-source/**'
      - 'product/**'
      - 'benchmark/**'
      - 'analysis/**'
      - '!**/.tmp/**'
      - '!**/archive/**'
      - '!**/references/**'
      - '!**/assets/**'
      - 'scripts/research_graph*.py'
      - 'scripts/research-graph-requirements.txt'
      - 'scripts/research-graph-browser-requirements.txt'
      - 'tests/test_research_graph.py'
      - 'tests/research_graph_browser.py'
      - 'tests/research_graph_publication.py'
      - 'docs/research-graph/index.html'
      - 'docs/research-graph/style.css'
      - 'docs/research-graph/app.js'
      - 'README.md'
      - '.research-graph.json'
      - '.github/workflows/research-graph.yml'
  workflow_dispatch:

# Serialize writes and Pages releases. A failed fast-forward never overwrites newer work.
concurrency:
  group: research-graph-openjiuwen-harness
  cancel-in-progress: false

permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: 构建、发布与线上验收
    if: github.ref == 'refs/heads/openjiuwen-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      fingerprint: ${{ steps.graph.outputs.fingerprint }}
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: openjiuwen-harness
          fetch-depth: 1
      - name: 记录本次源提交
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            scripts/research-graph-requirements.txt
            scripts/research-graph-browser-requirements.txt
      - name: 安装生成依赖和中文字体
        run: |
          python -m pip install -r scripts/research-graph-requirements.txt -r scripts/research-graph-browser-requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: 安装 Chromium 与系统依赖
        run: python -m playwright install --with-deps chromium
      - name: 验证数据提取与前端语法
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p test_research_graph.py -v
          node --check docs/research-graph/app.js
      - name: 根据当前分支生成图谱和 README
        run: python scripts/research_graph.py --branch openjiuwen-harness --repository "$GITHUB_REPOSITORY"
      - name: 验证本地文件、HTTP 和移动端交互
        run: python tests/research_graph_browser.py
      - name: 记录发布数据指纹
        id: graph
        run: |
          python -c "import json,os; value=json.load(open('docs/research-graph/graph.json',encoding='utf-8'))['fingerprint']; open(os.environ['GITHUB_OUTPUT'],'a').write('fingerprint='+value+'\n')"
      - name: 仅回写生成文件
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md docs/research-graph/graph.json docs/research-graph/graph-data.js docs/research-graph/preview.gif docs/research-graph/preview.png docs/research-graph/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m '更新调研图谱与成果目录'
            git push origin HEAD:openjiuwen-harness
          fi
      - name: 为发布产物生成版本与校验清单
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python scripts/research_graph_publication.py --source-commit "$SOURCE_SHA" --artifact-commit "$(git rev-parse HEAD)"
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传交互页面
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/research-graph
      - name: 保存浏览器检查截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-graph-browser-checks
          path: .tmp/research-graph/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: 发布交互调研图谱
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 核对线上版本、全部静态资源及桌面移动端页面
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          FINGERPRINT: ${{ steps.graph.outputs.fingerprint }}
        run: python tests/research_graph_publication.py --site-url "$PAGE_URL" --expected-commit "$SOURCE_SHA" --expected-fingerprint "$FINGERPRINT" --repository "$GITHUB_REPOSITORY"
      - name: 保存真实发布验收记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-graph-publication-checks
          path: .tmp/research-graph/publication/
          if-no-files-found: ignore
          retention-days: 7
