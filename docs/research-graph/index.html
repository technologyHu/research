<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="openJiuwen Harness 调研主题、类型与具体调研工作的交互图谱。">
  <title>调研星图 · openJiuwen Harness</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%2357deca'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23b0a0ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="graph-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a id="repository-link" class="brand" href="https://github.com/technologyHu/research/tree/openjiuwen-harness" target="_blank" rel="noopener noreferrer"><span class="brand-icon">✳</span> openJiuwen Harness <span class="brand-sub">/ RESEARCH</span></a>
    <div class="header-right"><span id="branch" class="branch">openjiuwen-harness</span><span class="live-dot"></span><span>仓库快照</span></div>
  </header>
  <main>
    <section class="intro">
      <div><div class="eyebrow">A CONSTELLATION OF RESEARCH</div><h1>调研工作，一览可见<span>。</span></h1><p>按实际关联连接主题与具体调研工作，以颜色区分类型。</p></div>
      <div id="stats" class="stats" aria-label="调研统计"></div>
    </section>
    <div class="workspace">
      <section class="map-panel" aria-label="交互调研图谱">
        <div class="toolbar">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索主题或具体调研工作…" aria-label="搜索节点" autocomplete="off"><kbd>/</kbd></label>
          <div class="filter-row">
            <select id="theme-filter" aria-label="按主题筛选"><option value="all">全部主题</option></select>
            <select id="type-filter" aria-label="按对象类型筛选"><option value="all">全部类型</option></select>
            <select id="report-filter" aria-label="按报告情况筛选">
              <option value="all">报告情况</option>
              <option value="reported">已有报告</option>
              <option value="planned">仅有计划</option>
            </select>
          </div>
        </div>
        <div class="map" id="map">
          <canvas id="graph" tabindex="0" role="img" aria-label="调研关系网络；可使用下方结果列表选择节点"></canvas>
          <div class="map-caption"><span class="live-dot"></span><span id="visible-count">正在读取图谱</span></div>
          <div class="map-controls" aria-label="图谱操作">
            <button id="zoom-in" aria-label="放大" title="放大">+</button>
            <button id="zoom-out" aria-label="缩小" title="缩小">−</button>
            <button id="reset" aria-label="重置视图" title="重置视图">⌖</button>
            <button id="motion" aria-label="暂停动画" title="暂停动画" aria-pressed="false">Ⅱ</button>
          </div>
          <div id="empty" class="empty" hidden>没有匹配的节点。试试调整筛选条件。</div>
          <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
          <div class="map-help">拖动节点或画布 · 滚轮缩放 · 点击查看详情</div>
        </div>
        <div class="legend">
          <span><i class="theme-symbol"></i>主题</span>
          <span><i class="work-symbol"></i>已有报告</span>
          <span><i class="work-symbol planned-symbol"></i>仅有计划</span>
          <div id="type-legend" class="type-legend"></div>
          <button id="clear-filters" class="text-button">清除筛选</button>
        </div>
      </section>
      <aside class="detail-panel" aria-label="节点详情">
        <div class="panel-heading"><span id="detail-eyebrow">探索入口</span><span class="small-mark">↗</span></div>
        <div id="detail" aria-live="polite"></div>
        <div class="results-heading"><h2>当前节点</h2><span id="result-count"></span></div>
        <div id="results" class="results" aria-label="可访问的节点列表"></div>
      </aside>
    </div>
    <footer><span id="provenance"></span><span>主题、类型与具体调研工作，按实际关联自由布局。<a href="https://github.com/technologyHu/research/blob/openjiuwen-harness/docs/research-graph-guide.md" id="guide-link" target="_blank" rel="noopener noreferrer">了解数据口径 ↗</a></span></footer>
  </main>
  <noscript><p class="noscript">交互图谱需要启用 JavaScript。你也可以在仓库 README 中查看主题与报告目录。</p></noscript>
</body>
</html>
